[project]
name = "kinova-tasks"
version = "0.1.0"
description = "Kinova Gen3 manipulation tasks for mjlab"
requires-python = ">=3.10,<3.14"
dependencies = [
    "mjlab",
    "pin>=3.9.0",
    "pynput>=1.7",
]

[tool.uv.sources]
mjlab = { path = "/media/cvlab/EXTDRIVE/sudhir/continual_learning/mjlab", editable = true }

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[project.scripts]
play-deploy = "kinova_tasks.play_deploy:main"
play = "kinova_tasks.play_keyboard:main"

[project.entry-points."mjlab.tasks"]
kinova_tasks = "kinova_tasks"
