[project]
name = "kinova-tasks"
version = "0.1.0"
description = "Kinova Gen3 manipulation tasks for mjlab"
requires-python = ">=3.10,<3.14"
dependencies = [
    "mjlab",
    "opencv-python>=4.8",
    "pyrealsense2>=2.55",
    "pin>=3.9.0",
    "pynput>=1.7",
    "kortex-api @ https://artifactory.kinovaapps.com/artifactory/generic-public/kortex/API/2.6.0/kortex_api-2.6.0.post3-py3-none-any.whl",
    "depthai>=3.5.0",
    "transformers>=5.6.2",
    "huggingface-hub>=1.12.0",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "h5py>=3.10",
]

[tool.uv]
override-dependencies = [
    "protobuf==3.20.0",
]

[tool.uv.sources]
mjlab = { path = "../mjlab", editable = true }

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[project.scripts]
play-deploy = "kinova_tasks.play_deploy:main"
play = "kinova_tasks.play_keyboard:main"
eval = "kinova_tasks.eval:main"
viz-eval = "kinova_tasks.viz_eval:main"
train-distill = "kinova_tasks.train_distill:main"

[project.entry-points."mjlab.tasks"]
kinova_tasks = "kinova_tasks"
